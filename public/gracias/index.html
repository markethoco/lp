<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <title>Gracias | MarketHO</title>

  <meta
    name="description"
    content="Recibimos correctamente tu solicitud de contacto."
  >

  <link
    rel="stylesheet"
    href="/css/tokens.css"
  >

  <link
    rel="stylesheet"
    href="/css/base.css"
  >

  <link
    rel="stylesheet"
    href="/css/layout.css"
  >

  <link
    rel="stylesheet"
    href="/css/components.css"
  >

  <link

    href="/css/utilities.css"

</head>


<body>

  <header class="site-header">

    <div class="container site-header__inner">

      <a
        class="site-logo"
        href="/"
        aria-label="MarketHO - Inicio"
      >

        <img
          src="/assets/images/marketho-logo.svg"
          alt="MarketHO"
          width="220"
        >

      </a>

    </div>

  </header>


  <main>

    <section class="thank-you">

      <div class="container">

        <div class="thank-you__content">

          <p class="section-eyebrow">
            Solicitud recibida
          </p>


          <h1>
            Gracias.
          </h1>


          <p class="text-large">
            Recibimos tu información correctamente.
            Pronto nos pondremos en contacto contigo.
          </p>


          <a
            class="btn btn--primary"
            href="/"
          >
            Volver a MarketHO
          </a>

        </div>

      </div>

    </section>

  </main>

</html>
